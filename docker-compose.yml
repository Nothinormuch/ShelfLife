services:
  postgres:
    image: postgres:16-alpine
    container_name: shelflife-postgres
    restart: always
    environment:
      POSTGRES_USER: shelflife
      POSTGRES_PASSWORD: shelflife_password
      POSTGRES_DB: shelflife_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelflife -d shelflife_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: shelflife-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelflife-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://shelflife:shelflife_password@postgres:5432/shelflife_db?schema=public
      - JWT_SECRET=shelflife_super_secret_jwt_key_2024
      - JWT_REFRESH_SECRET=shelflife_super_secret_refresh_jwt_key_2024
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shelflife-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
